name: TheRock Test MADEngine Workloads for rccl

on:
  workflow_call:
    inputs:
      amdgpu_families:
        type: string
      artifact_group:
        type: string
      test_runs_on:
        type: string
      artifact_run_id:
        type: string
      workload:
        type: string
        default: 'llama-3.1-70b-training'
      nodes:
        type: string
        default: '2'
      notify_email:
        type: string
        default: ''
      teams_webhook:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      amdgpu_families:
        type: string
      artifact_group:
        type: string
      test_runs_on:
        type: string
        default: 'ruby-linux-slurm-scale-runner'
      artifact_run_id:
        description: 'Reuse artifacts from a previous build run ID'
        type: string
      workload:
        description: 'MADEngine workload to run'
        type: string
        default: 'llama-3.1-70b-training'
      nodes:
        description: 'Number of SLURM nodes to allocate'
        type: string
        default: '2'
      notify_email:
        description: 'Email address to send test summary report'
        type: string
        default: ''
      teams_webhook:
        description: 'Teams webhook URL for notifications'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test_madengine:
    name: 'Test MADEngine ${{ inputs.workload }} (${{ inputs.nodes }}N)'
    runs-on: ${{ inputs.test_runs_on }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Probe compute nodes via srun
        run: |
          set +e
          echo "submitting from: $(hostname)  runner=${RUNNER_NAME}"
          echo "login node /tmp: $(df -h /tmp | tail -1)"
          command -v srun >/dev/null || { echo "no srun here"; exit 0; }

          timeout 600 srun -N2 --ntasks-per-node=1 -p meta64 -t 2 \
            --job-name=madengine-nodeprobe bash -c '
              echo "=== $(hostname) rank=${SLURM_PROCID} ===";
              echo "  id: $(id)";
              echo "  python3: $(command -v python3 || echo MISSING) $(python3 --version 2>&1)";
              echo "  pip3: $(command -v pip3 || echo MISSING)";
              echo "  docker: $(command -v docker || echo MISSING) $(docker --version 2>&1 | head -1)";
              echo "  docker daemon: $(docker info --format "{{.ServerVersion}}" 2>&1 | head -1)";
              echo "  kfd: $(ls /dev/kfd 2>&1 | head -1)";
              echo "  renderD: $(ls -d /dev/dri/renderD* 2>/dev/null | head -1)";
              echo "  /apps: $(ls -d /apps/rccl-ci/madengine 2>&1 | head -1)";
              echo "  /tmp: $(df -h /tmp | tail -1)";
              echo "  PATH=$PATH";
            ' 2>&1 | head -40
          echo "srun exit=$?"
          exit 0
